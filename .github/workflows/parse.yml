name: Парсинг остатков SaleTennis

on:
  schedule:
    # Каждый день в 07:00 UTC (12:00 по Екатеринбургу). Измените при желании.
    - cron: '0 7 * * *'
  workflow_dispatch:   # ручной запуск кнопкой во вкладке Actions

permissions:
  contents: write      # чтобы бот мог закоммитить обновлённые данные

concurrency:
  group: parse
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SALETENNIS_EMAIL: ${{ secrets.SALETENNIS_EMAIL }}
      SALETENNIS_PASSWORD: ${{ secrets.SALETENNIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Установить зависимости парсера
        run: pip install -r parser/requirements.txt

      - name: Кэш фотографий (не скачивать заново каждый раз)
        uses: actions/cache@v4
        with:
          path: public/data/product_images
          key: product-images-${{ github.run_id }}
          restore-keys: product-images-

      - name: Запуск HTTP-парсера (данные сразу в public/data)
        run: python parser/http_parser.py --out public/data

      - name: Загрузить лог парсера (для диагностики — и при ошибке тоже)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parse-log-${{ github.run_id }}
          path: |
            public/data/parse.log
            public/data/debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Сжать новые фотографии (PNG → WebP)
        run: |
          npm ci
          npm run compress-images

      - name: Убрать оригиналы фото (в git публикуем только WebP)
        # Страховка: compress-images удаляет оригинал только после успешного
        # сжатия, а уже существующий WebP пропускает. Без этого шага парсер
        # каждую ночь заново качает PNG, и они уезжают в git (~1 ГБ за прогон).
        # Удаляем только те оригиналы, у которых ЕСТЬ WebP-пара — фото не теряются.
        run: |
          deleted=0
          for f in public/data/product_images/*.png public/data/product_images/*.jpg public/data/product_images/*.jpeg; do
            [ -e "$f" ] || continue
            base="${f%.*}"
            if [ -f "$base.webp" ]; then rm -f "$f"; deleted=$((deleted + 1)); fi
          done
          echo "Удалено оригиналов с готовым WebP: $deleted"
          du -sh public/data/product_images

      - name: Закоммитить обновлённые данные
        run: |
          git config user.name "saletennis-parser[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Данные не изменились — коммит не нужен"
          else
            git commit -m "data: автоматический парсинг остатков $(date -u +%Y-%m-%d)"
            if ! git push origin HEAD:"$GITHUB_REF_NAME"; then
              # За время парсинга (~1-2 ч) в ветку могли запушить другие коммиты.
              # Перекладываем СВЁЖИЕ данные поверх последней версии ветки:
              # reset --mixed сохраняет рабочие файлы (наш парсинг) и берёт
              # чужие изменения кода из origin, затем коммитим только public/data.
              echo "[WARN] Ветка ушла вперёд — перекладываю данные поверх последней версии"
              git fetch origin "$GITHUB_REF_NAME"
              git reset --mixed FETCH_HEAD
              git add public/data
              if git diff --cached --quiet; then
                echo "Данные уже актуальны — коммит не нужен"
              else
                git commit -m "data: автоматический парсинг остатков $(date -u +%Y-%m-%d)"
                git push origin HEAD:"$GITHUB_REF_NAME"
              fi
            fi
          fi
