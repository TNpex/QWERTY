<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BI-дашборд для аналитики наличия товаров и размеров по магазинам сети SaleTennis"
    />
    <title>SaleTennis Analytics — Аналитика наличия товаров</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f9fafb;
      }
      html.dark,
      html.dark body {
        background-color: #0f141c;
      }
      /* Тултипы Recharts: в тёмной теме без них оставалась бы белая плашка */
      :root {
        --tip-bg: #ffffff;
        --tip-border: #e5e7eb;
        --tip-text: #1f2937;
        --tip-muted: #6b7280;
      }
      html.dark {
        --tip-bg: #151b25;
        --tip-border: #2c3542;
        --tip-text: #e5e9f0;
        --tip-muted: #9aa7b8;
      }
    </style>
    <script>
      // Тема — до первой отрисовки, чтобы не было белой вспышки
      (function () {
        try {
          var saved = localStorage.getItem('st-theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* приватный режим — остаётся светлая тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
